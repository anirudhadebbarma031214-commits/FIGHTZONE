<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1118">
  <meta name="description" content="FIGHTZONE — your fighter lobby.">
  <title>FIGHTZONE — Lobby</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="lobby.css">
</head>
<body>
  <div class="ambient ambient-a" aria-hidden="true"></div><div class="ambient ambient-b" aria-hidden="true"></div>
  <header class="topbar">
    <a class="brand" href="#home" aria-label="FIGHTZONE home"><span class="brand-icon">F<span>Z</span></span><span>FIGHT<span>ZONE</span><small>ARENA LOBBY</small></span></a>
    <div class="top-status"><i></i> LOCAL PROFILE <span class="beta">DEMO</span></div>
    <div class="wallet"><span>🪙 <b id="coin-count">2,450</b></span><span>✦ <b id="gem-count">120</b></span></div>
    <button class="icon-button" data-screen="settings" aria-label="Open settings">⚙</button>
  </header>
  <main id="app" class="app-main" tabindex="-1"></main>
  <nav class="bottom-nav" aria-label="Main navigation">
    <button class="nav-item active" data-screen="home"><span>⌂</span><small>HOME</small></button>
    <button class="nav-item" data-screen="modes"><span>⚔</span><small>PLAY</small></button>
    <button class="nav-item nav-play" data-screen="modes" aria-label="Play"><span>▶</span></button>
    <button class="nav-item" data-screen="inventory"><span>▤</span><small>LOADOUT</small></button>
    <button class="nav-item" data-screen="profile"><span>◉</span><small>PROFILE</small></button>
  </nav>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="lobby.js"></script>
</body>
</html>
